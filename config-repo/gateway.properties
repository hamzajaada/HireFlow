server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Routage automatique par nom Eureka (comme tp-ms-ecom) : http://localhost:8080/service-offres/offers
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Routes "propres" pour le front : http://localhost:8080/offers, /applications, /interviews, /candidates
spring.cloud.gateway.server.webflux.routes[0].id=service-offres
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-offres
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/offers/**

spring.cloud.gateway.server.webflux.routes[1].id=service-candidatures
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-candidatures
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/applications/**,/interviews/**

spring.cloud.gateway.server.webflux.routes[2].id=service-talents
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-talents
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/candidates/**
