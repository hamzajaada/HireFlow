server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Base H2 en memoire : l'historique des notifications envoyees (vide au demarrage)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8084/h2-console (JDBC URL : jdbc:h2:mem:notificationsdb, user sa, sans mot de passe)
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

#Config RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=hireflow
spring.rabbitmq.password=hireflow
