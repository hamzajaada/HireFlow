server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Base H2 en memoire : l'historique des notifications envoyees (vide au demarrage)
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8084/h2-console (JDBC URL : jdbc:h2:mem:notificationsdb, user sa, sans mot de passe)
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

#Config RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=hireflow
spring.rabbitmq.password=hireflow

# SMTP : Mailpit en local (boite de reception : http://localhost:8025). Dans Docker : MAIL_HOST=mailpit
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
hireflow.mail.from=noreply@hireflow.local

# Echec d'envoi : 3 tentatives (premiere comprise), puis message rejete sans remise en file
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false
