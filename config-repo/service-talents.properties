server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Base H2 en memoire (recreee a chaque demarrage, alimentee par data.sql)
spring.datasource.url=jdbc:h2:mem:talentsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8083/h2-console (JDBC URL : jdbc:h2:mem:talentsdb, user sa, sans mot de passe)
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

#Config RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=hireflow
spring.rabbitmq.password=hireflow
