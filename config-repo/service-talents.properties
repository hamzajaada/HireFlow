server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Base H2 en memoire (recreee a chaque demarrage, alimentee par data.sql)
spring.datasource.url=jdbc:h2:mem:talentsdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8083/h2-console (JDBC URL : jdbc:h2:mem:talentsdb, user sa, sans mot de passe)
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

#Config RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=hireflow
spring.rabbitmq.password=hireflow

# Listener en erreur : 3 essais (attente 1 s puis 2 s), puis le message part dans talents.dlq
# avec la cause de l'erreur en en-tete (voir RabbitConfig.messageRecoverer). Jamais de boucle infinie.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
