server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Base H2 en memoire (recreee a chaque demarrage, alimentee par data.sql)
spring.datasource.url=jdbc:h2:mem:candidaturesdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8082/h2-console (JDBC URL : jdbc:h2:mem:candidaturesdb, user sa, sans mot de passe)
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

#Config RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=hireflow
spring.rabbitmq.password=hireflow


#Config OpenFeign (delais par appel, en millisecondes)
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

#Config Resilience4j (une instance par service appele, meme nom que le @FeignClient)
resilience4j.retry.instances.service-offres.max-attempts=3
resilience4j.retry.instances.service-offres.wait-duration=500ms
resilience4j.retry.instances.service-offres.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.retry.instances.service-talents.max-attempts=3
resilience4j.retry.instances.service-talents.wait-duration=500ms
resilience4j.retry.instances.service-talents.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.circuitbreaker.instances.service-offres.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-offres.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-offres.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-offres.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-offres.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-offres.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-offres.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-offres.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.service-talents.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.service-talents.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-talents.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-talents.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-talents.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-talents.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-talents.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-talents.automatic-transition-from-open-to-half-open-enabled=true

#Feign + Resilience4j : sans cette ligne, les fallbacks ne sont jamais appeles (bloc 0, kick-off)
spring.cloud.openfeign.circuitbreaker.enabled=true
#1 s par defaut : trop court au premier appel
resilience4j.timelimiter.configs.default.timeout-duration=5s
