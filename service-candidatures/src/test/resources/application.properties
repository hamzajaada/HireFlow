# Remplace le application.properties principal pendant les tests :
# pas de Config Server, d'Eureka ni de RabbitMQ. Spring Boot crée une base H2 vide.
spring.application.name=service-candidatures
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.sql.init.mode=never
