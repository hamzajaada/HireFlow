# Infrastructure locale de Hire-Flow : uniquement RabbitMQ
# (les bases sont en H2 en memoire, dans chaque service : rien a installer).
# Demarrage : docker compose up -d
# Console d'administration : http://localhost:15672 (hireflow / hireflow)
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hireflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hireflow
      RABBITMQ_DEFAULT_PASS: hireflow
    ports:
      - "5672:5672"
      - "15672:15672"
