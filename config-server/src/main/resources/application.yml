server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Les fichiers de configuration des services sont dans src/main/resources/config-repo/.
          # Ils sont lus depuis le classpath : ca marche quel que soit le repertoire de lancement
          # (IntelliJ, mvn, java -jar). Apres une modification, redemarrer le Config Server.
          search-locations: ${CONFIG_REPO_PATH:classpath:/config-repo}
