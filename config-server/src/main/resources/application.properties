spring.application.name=config-server

server.port=8888

# Les fichiers de configuration des services sont dans le dossier config-repo/ a la racine du depot
# (comme dans tp-ms-ecom). Mode "native" : lecture directe sur le disque, sans passer par GitHub,
# ce qui permet de tester une modification de config sur sa branche avant la fusion.
# Les deux chemins couvrent un lancement depuis la racine (mvnw) ou depuis le module (IntelliJ).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:./config-repo/,file:../config-repo/}

